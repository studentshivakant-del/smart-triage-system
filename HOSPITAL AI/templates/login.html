<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Care - Emergency Command Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        .badge {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        h2 { margin: 15px 0 5px 0; color: #0f172a; }
        p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-weight: bold; font-size: 13px; color: #334155; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #1d4ed8; }
        .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; }
        .credentials-tip {
            margin-top: 20px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #475569;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

<div class="login-card">
    <span class="badge">COMMAND CENTER ACCESS</span>
    <h2>🏥 SMART CARE AI</h2>
    <p>Emergency Clinical Triage System</p>

    {% if error %}
        <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="input-group">
            <label>Staff Username:</label>
            <input type="text" name="username" placeholder="e.g. admin" required autofocus>
        </div>

        <div class="input-group">
            <label>Password:</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">🔐 Enter Command Center</button>
    </form>

    <div class="credentials-tip">
        <strong>Demo Credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
</div>

</body>
</html>
